[package]
name = "aiwf-core-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
aiwf-engine = { path = "../engine" }
aiwf-store = { path = "../store" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
# 只给测试用：拿 TypeScript 生成的 JSON Schema 校验引擎的真实输出。
# default-features 关掉是为了不把 HTTP 客户端拉进来 —— 契约的 schema
# 全在本地文件里，一条远程引用都没有。
jsonschema = { version = "0.49", default-features = false }
