name: CI

# 只手动触发。
#
# 门禁改在本地跑：提交前一条 `pnpm verify` + 端到端，比等 CI 反馈快得多，
# 而且失败时能直接看到浏览器现场。CI 留着，需要时手动跑一次
# （比如换机器、或怀疑本地环境有偏差 —— Linux 与 macOS 的差异确实咬过一次）。
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 依赖装在 CI 缓存里，别让 corepack 再去下一份
  PNPM_VERSION: 11.17.0

jobs:
  # TypeScript 侧：格式、lint、类型、测试、契约生成物一致性
  node:
    name: Node（契约 / UI / 客户端）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      # 契约是单一真源：生成物必须与源一致，手改 generated/ 会在这里被打回
      - name: 契约生成物未漂移
        run: pnpm contracts:check

      - name: 构建 Web 形态
        run: pnpm --filter @aiwf/web build

  # Rust 侧：引擎与存储层
  rust:
    name: Rust（引擎 / 存储）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: 安装 Rust 工具链
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      # shared-key 必须显式给：rust-cache 默认把 job 名放进 cache key，
      # 于是同一平台的每个 job 各存一份缓存，谁也用不上谁的，还互相 LRU 驱逐。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64
          cache-all-crates: true
          # 只让 main 写缓存：PR 与 tag 只读，避免把主缓存挤掉
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 格式检查
        run: cargo fmt --all -- --check

      # 桌面壳要系统 GUI 依赖，Linux runner 上不编；其余 crate 全查
      - name: Clippy（warnings 视为错误）
        run: cargo clippy -p aiwf-engine -p aiwf-store -p aiwf-core-api -p aiwf-devserver --all-targets -- -D warnings

      - name: 测试
        run: cargo test -p aiwf-engine -p aiwf-store -p aiwf-core-api

  # 端到端：浏览器真实点击 → HTTP 桥接 → 真实引擎。
  #
  # 单元测试证明不了「装好的应用能干活」——这一层抓到过六个缺陷，
  # 当时单元测试全绿（见 docs/testing/README.md）。
  e2e:
    name: 端到端（浏览器 + API）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: 安装 Rust 工具链
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 构建开发服务
        run: cargo build -p aiwf-devserver

      - name: 起开发服务与 Web
        run: |
          mkdir -p /tmp/aiwf-ci
          ./target/debug/aiwf-devserver --port 5177 --db /tmp/aiwf-ci/aiwf.sqlite &
          VITE_AIWF_SERVER=http://127.0.0.1:5177 pnpm dev &

          # 两个服务都起来了才往下走，否则第一条用例会因为连不上而失败。
          # 等的是 localhost 而不是 127.0.0.1：Vite 绑在 localhost 上，
          # 而 CI 的 localhost 会解析到 ::1，用 IP 等会一直超时
          npx wait-on http://localhost:5173 -t 90000
          curl -sf -X POST http://127.0.0.1:5177/ipc/workflow_list -d '{}' > /dev/null

      - name: 铺基线数据
        # 很多界面元素只在「有数据」时才渲染（运行详情、模型详情、事件卡）。
        # 空库跑尺寸对照，一半选择器找不到元素，测的是空气
        run: node scripts/seed-test-data.mjs --api http://127.0.0.1:5177

      - name: API 层端到端
        run: |
          # worktree 那组需要一个真实仓库，现建一个
          git init -q -b main /tmp/aiwf-ci/repo
          cd /tmp/aiwf-ci/repo
          git config user.email ci@aiwf.test && git config user.name CI
          echo base > README.md && git add -A && git commit -qm init
          cd -
          python3 tests/e2e/api_e2e.py --workdir /tmp/aiwf-ci/runs --repo /tmp/aiwf-ci/repo

      - name: 浏览器端到端
        run: pnpm exec playwright test

      - name: 失败时留下现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-失败现场
          path: |
            test-results/
            docs/testing/playwright-report/
          retention-days: 7

  # 安全回归：导出物、事件、预览中不得出现 Secret（质量门禁 §14）
  secrets:
    name: Secret 泄漏扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 扫描已跟踪文件
        run: node scripts/scan-secrets.mjs

  # macOS runner 按 10 倍计费，所以先在 Linux 上判断这次改动到底碰没碰桌面壳
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          # 拿不到前一个提交（首次推送、force push）时保守地跑一遍
          if ! base=$(git rev-parse HEAD^ 2>/dev/null); then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD \
            | grep -qE '^(apps/desktop/|crates/|Cargo\.(toml|lock)|rust-toolchain\.toml|\.github/workflows/)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "::notice::本次改动未涉及桌面壳与 Rust，跳过 macOS 编译"
          fi

  # 桌面壳只在 macOS 上编译得动，所以按需触发
  desktop:
    name: 桌面壳编译（macOS）
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 工具链
        run: rustup toolchain install stable --profile minimal

      # 与 Release 用同一个 key，并且也编 release profile。
      # 这样在 main 上改过桌面壳之后，发版能直接命中这份缓存
      # （发版也只在 main 上跑，作用域一致）。
      # 代价是这个 job 比 cargo check 慢，但它只在改了桌面壳 / Rust 时才触发。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64-release
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 编译检查（release profile，与发版共享缓存）
        run: cargo check --release -p aiwf-desktop
