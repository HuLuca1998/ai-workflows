name: Release

# 只手动触发，且**只在 main 上跑**。两个原因：
#
# 1. 省额度：macOS runner 按 10 倍计费，每次提交都发版会很快吃掉配额，
#    而绝大多数提交没人会去装。
# 2. 缓存能命中：GitHub Actions 的缓存有 ref 作用域——一个 run 只能读
#    「自己这个 ref」和「默认分支」的缓存。以前用 tag 触发，
#    每个 tag 写的缓存只对自己可见，下一次发版换了 tag 就读不到，
#    等于每次发版都从零编译整个依赖树（实测 6 分钟）。
#    在 main 上跑，作用域就是 main，一直命中。
#
# tag 由 tauri-action 在发布时创建，不需要预先打。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式版版本号，如 0.2.0。留空则发一个预发布快照（不会成为 latest）'
        type: string
        default: ''
      dry_run:
        description: '只构建不发布（验证流水线本身）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 版本解析与幂等检查都放在 Linux 上（1 倍计费）。
  # 重发一个已存在的版本时，macOS runner 根本不会启动。
  plan:
    name: 解析版本
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      exists: ${{ steps.existing.outputs.exists }}
    steps:
      # 版本策略：
      #   填了 version → 正式版，标记 latest，成为已安装用户的更新目标
      #   留空        → 预发布快照，不会成为 latest
      - name: 解析版本
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:7}"
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            # 先挡掉手滑：v 前缀、空格、非 semver 都会让 updater 的版本比较失效
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::版本号必须是 semver（如 0.2.0），不要带 v 前缀。收到：$INPUT_VERSION"
              exit 1
            fi
            version="$INPUT_VERSION"
            tag="v${version}"
            prerelease=false
            channel=stable
          else
            version="0.0.0-snapshot.$(date -u +%Y%m%d).${sha}"
            tag="snapshot-$(date -u +%Y%m%d)-${sha}"
            prerelease=true
            channel=snapshot
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: 检查是否已发布
        id: existing
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          exists=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
            echo "::notice::$TAG 已存在，跳过构建（未启动 macOS runner）"
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  build:
    name: macOS arm64
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 工具链
        # universal 包要把两个架构都编出来再合并，所以两个 target 都得装。
        # 公司里的 Mac 有 Apple Silicon 也可能有 Intel —— 只出 aarch64
        # 的话，Intel 机器上双击没有任何反应
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      # 缓存要**写**：CI 那边跑的是 cargo check（debug profile，产物是 rmeta），
      # 与这里的 release 构建不共享编译产物，只共享 crates 下载。
      # 所以发版必须自己保存一份 release profile 的 target。
      # 因为这个 workflow 只在 main 上跑，写下的缓存作用域就是 main，
      # 下次发版（同样在 main 上）必然命中。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64-release
          cache-all-crates: true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 发布前最后一道门禁：不把坏版本推给用户。
      # 刻意不跑 cargo test —— 它用 debug profile，会把整个依赖树再编译一遍
      # （与紧接着的 release 构建不共享产物），单这一步就多花一分多钟。
      # Rust 侧由 main 上的 CI 覆盖；这里只留跑得快、且能挡住发布事故的检查。
      - name: 门禁
        run: |
          pnpm test
          pnpm contracts:check
          node scripts/scan-secrets.mjs

      - name: 写入版本号
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          conf=apps/desktop/src-tauri/tauri.conf.json
          tmp=$(mktemp)
          # 版本只在发布时注入，仓库里始终是 0.0.0——避免每次发版都产生一次版本号提交
          jq --arg v "$VERSION" '.version = $v' "$conf" > "$tmp" && mv "$tmp" "$conf"
          jq -r '.version' "$conf"

      # Apple 证书是可选的。这一步存在的原因：GitHub Actions 无法「条件性地不设置」
      # 某个 env key——把空的 APPLE_CERTIFICATE 传给 tauri-action，它照样会去
      # `security import` 一个空证书然后失败。所以拆成两个互斥的构建步骤。
      - name: 检测是否具备 Apple 签名能力
        id: signing
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "${CERT:-}" ]; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 Apple 证书（内部分发）：产物做 ad-hoc 签名，装的时候跑 scripts/install-app.sh"
          fi

      - name: 构建并发布（含 Apple 签名与公证）
        if: ${{ !inputs.dry_run && steps.signing.outputs.apple == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: ${{ needs.plan.outputs.tag }}
          releaseBody: |
            通道：${{ needs.plan.outputs.channel }} · 提交 ${{ github.sha }}

            应用内「设置与环境 → 检查更新」可一键更新；更新包经签名校验后才安装。
          releaseDraft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      - name: 构建并发布（ad-hoc 签名，未公证）
        if: ${{ !inputs.dry_run && steps.signing.outputs.apple != 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 更新包仍然签名——那用的是自己的 minisign 密钥，与 Apple 证书无关。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ad-hoc 签名（identity "-"）：免费、不需要任何 Apple 账号。
          # Apple Silicon 要求 arm64 可执行文件必须有签名 —— 只靠链接器那份
          # linker-signed 不覆盖 bundle，Gatekeeper 会直接判「已损坏」。
          # 加上这行才退化成正常的「未认证开发者」提示，那一层由
          # scripts/install-app.sh 解除隔离标记来过。
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: ${{ needs.plan.outputs.tag }}
          releaseBody: |
            通道：${{ needs.plan.outputs.channel }} · 提交 ${{ github.sha }}

            ⚠️ 未经 Apple 公证（内部分发，不买 Developer ID）。

            **首次安装**：下载 dmg 之后跑一次
            `bash scripts/install-app.sh ~/Downloads/<下载的.dmg>`。
            它会装到 /Applications 并解除隔离标记 —— macOS 15 起
            「右键 → 打开」不再绕得过 Gatekeeper，那条老办法已经失效。

            应用内「设置与环境 → 检查更新」可一键更新；更新包经签名校验后才安装。
          releaseDraft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      - name: 只构建不发布
        if: ${{ inputs.dry_run }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
        # 必须用 exec 直传：`pnpm run build -- --target ...` 里的 `--` 会把参数
        # 交给 cargo 而不是 tauri，结果 cargo 编到 target/<triple>/ 而 bundler
        # 仍去找 target/release/，报 "can't open main binary"
        run: pnpm --filter @aiwf/desktop exec tauri build --target universal-apple-darwin

      - name: 摘要
        if: always()
        shell: bash
        run: |
          {
            echo "## Release"
            echo
            echo "- 版本：\`${{ needs.plan.outputs.version }}\`"
            echo "- Tag：\`${{ needs.plan.outputs.tag }}\`"
            echo "- 通道：${{ needs.plan.outputs.channel }}"
            echo "- 结果：${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
