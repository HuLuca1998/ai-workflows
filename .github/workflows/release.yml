name: Release

# 刻意**不**在 push main 时触发：macOS runner 按 10 倍计费，
# 每次提交都出一个快照会很快吃掉 Actions 额度，而绝大多数提交没人会去装。
# 发布一律是主动行为：打 tag，或在 Actions 页面手动点 Run workflow。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建不发布（验证流水线本身）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 版本解析与幂等检查都放在 Linux 上（1 倍计费）。
  # 重跑一个已发布的 tag 时，macOS runner 根本不会启动。
  plan:
    name: 解析版本
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      exists: ${{ steps.existing.outputs.exists }}
    steps:
      # 版本策略：
      #   tag v1.2.3 → 正式版 1.2.3，标记 latest，成为已安装用户的更新目标
      #   手动触发   → 预发布快照，不会成为 latest
      - name: 解析版本
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            tag="v${version}"
            prerelease=false
            channel=stable
          else
            version="0.0.0-snapshot.$(date -u +%Y%m%d).${sha}"
            tag="snapshot-$(date -u +%Y%m%d)-${sha}"
            prerelease=true
            channel=snapshot
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: 检查是否已发布
        id: existing
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          exists=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
            echo "::notice::$TAG 已存在，跳过构建（未启动 macOS runner）"
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  build:
    name: macOS arm64
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 工具链
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin

      # 缓存要**写**：CI 那边跑的是 cargo check（debug profile，产物是 rmeta），
      # 与这里的 release 构建不共享编译产物，只共享 crates 下载。
      # 所以发版必须自己保存一份 release profile 的 target，
      # 下一次发版才能真正复用——不写的话每次发版都从零编译。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64-release
          cache-all-crates: true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 发布前最后一道门禁：不把坏版本推给用户。
      # 刻意不跑 cargo test —— 它用 debug profile，会把整个依赖树再编译一遍
      # （与紧接着的 release 构建不共享产物），单这一步就多花一分多钟。
      # Rust 侧由 main 上的 CI 覆盖；这里只留跑得快、且能挡住发布事故的检查。
      - name: 门禁
        run: |
          pnpm test
          pnpm contracts:check
          node scripts/scan-secrets.mjs

      - name: 写入版本号
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          conf=apps/desktop/src-tauri/tauri.conf.json
          tmp=$(mktemp)
          # 版本只在发布时注入，仓库里始终是 0.0.0——避免每次发版都产生一次版本号提交
          jq --arg v "$VERSION" '.version = $v' "$conf" > "$tmp" && mv "$tmp" "$conf"
          jq -r '.version' "$conf"

      # Apple 证书是可选的。这一步存在的原因：GitHub Actions 无法「条件性地不设置」
      # 某个 env key——把空的 APPLE_CERTIFICATE 传给 tauri-action，它照样会去
      # `security import` 一个空证书然后失败。所以拆成两个互斥的构建步骤。
      - name: 检测是否具备 Apple 签名能力
        id: signing
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "${CERT:-}" ]; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 Apple 证书：产物做 ad-hoc 签名，用户首次打开需右键 → 打开"
          fi

      - name: 构建并发布（含 Apple 签名与公证）
        if: ${{ !inputs.dry_run && steps.signing.outputs.apple == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: ${{ needs.plan.outputs.tag }}
          releaseBody: |
            通道：${{ needs.plan.outputs.channel }} · 提交 ${{ github.sha }}

            应用内「设置与环境 → 检查更新」可一键更新；更新包经签名校验后才安装。
          releaseDraft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin

      - name: 构建并发布（ad-hoc 签名，未公证）
        if: ${{ !inputs.dry_run && steps.signing.outputs.apple != 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 更新包仍然签名——那用的是自己的 minisign 密钥，与 Apple 证书无关。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ad-hoc 签名（identity "-"）：Apple Silicon 要求 arm64 可执行文件必须有签名。
          # 只靠链接器那份 linker-signed 签名不覆盖 bundle，Gatekeeper 会直接判「已损坏」，
          # 连右键打开都绕不过。加上这行才退化成正常的「未认证开发者」提示。
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: ${{ needs.plan.outputs.tag }}
          releaseBody: |
            通道：${{ needs.plan.outputs.channel }} · 提交 ${{ github.sha }}

            ⚠️ 未经 Apple 公证：首次打开请右键 → 打开。

            应用内「设置与环境 → 检查更新」可一键更新；更新包经签名校验后才安装。
          releaseDraft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin

      - name: 只构建不发布
        if: ${{ inputs.dry_run }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
        # 必须用 exec 直传：`pnpm run build -- --target ...` 里的 `--` 会把参数
        # 交给 cargo 而不是 tauri，结果 cargo 编到 target/<triple>/ 而 bundler
        # 仍去找 target/release/，报 "can't open main binary"
        run: pnpm --filter @aiwf/desktop exec tauri build --target aarch64-apple-darwin

      - name: 摘要
        if: always()
        shell: bash
        run: |
          {
            echo "## Release"
            echo
            echo "- 版本：\`${{ needs.plan.outputs.version }}\`"
            echo "- Tag：\`${{ needs.plan.outputs.tag }}\`"
            echo "- 通道：${{ needs.plan.outputs.channel }}"
            echo "- 结果：${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
