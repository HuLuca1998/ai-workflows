[workspace]
resolver = "3"
members = [
  "crates/core-api",
  "crates/devserver",
  "crates/engine",
  "crates/store",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order：JSON 对象保持文件里的键序。
#
# 契约生成物里字段的顺序就是 Zod schema 的声明顺序，而 Zod 报校验问题
# 也按那个顺序。默认的 BTreeMap 会按字母重排，于是同一份坏配置在
# TypeScript 那边报「解释器…；脚本内容…」，在这边报的是另一个次序 ——
# 而 `conformance_test` 是逐字比的。
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
# thin LTO 而不是 fat：编译时间少三到五成，包体只大一点点
# （实测 dmg 2.7 MB 级别，仍远小于同类 Electron 应用）。
# 发版频率比包体那零点几兆更值钱。
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
