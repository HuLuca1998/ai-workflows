[workspace]
resolver = "3"
members = [
  "crates/core-api",
  "crates/devserver",
  "crates/engine",
  "crates/store",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
# thin LTO 而不是 fat：编译时间少三到五成，包体只大一点点
# （实测 dmg 2.7 MB 级别，仍远小于同类 Electron 应用）。
# 发版频率比包体那零点几兆更值钱。
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
